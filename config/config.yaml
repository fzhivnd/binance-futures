app:
  mode: "live"
  log_level: "info"
  paper_balance: 1000.0
  pprof_port: 6060

binance:
  api_key: "${BINANCE_API_KEY}"
  api_secret: "${BINANCE_API_SECRET}"
  base_url: "https://fapi.binance.com"
  ws_url: "wss://fstream.binance.com"
  testnet: false

trading:
  cooldown_minutes: 10  # not configurable via DB

funding:
  top_candidates: 10    # not configurable via DB

execution:
  tp1_size_pct: 50
  slippage_bps: 1
  trailing_callback_rate: 1.05
  tp2_pct: 4.0
  force_sl_enabled: false
  force_sl_pnl_gate_pct: -1.5
  force_sl_escalate_pnl_pct: -2.5
  force_sl_slow_interval_sec: 300
  force_sl_fast_interval_sec: 90

scheduler:
  scan_interval_early: "1m"
  scan_interval_late: "1m"
  window_start_minutes: 30

websocket:
  ping_interval: "2m"
  stale_timeout: "30s"
  max_reconnect_failures: 5
  reconnect_base_backoff: "1s"
  reconnect_max_backoff: "30s"

database:
  postgres:
    host: "${POSTGRES_HOST}"
    port: 5432
    user: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    dbname: "${POSTGRES_DB}"
    sslmode: "disable"
    max_conns: 10
  redis:
    addr: "${REDIS_HOST}:6379"
    password: "${REDIS_PASSWORD}"
    db: 0

scoring:
  min_score: 42.0
  min_score_override: 42.0
  # weights, thresholds, filtering, trading, funding, execution params → managed via scoring config in DB


risk:
  max_daily_losses: 6
  max_drawdown_pct: 10.0
  max_atr_ratio: 8.0
  btc_breakout_reject: true

llm:
  enabled: true
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-5.4"
  timeout_secs: 45
  max_retries: 1
  max_rpm: 20
  top_candidates: 5
  min_confidence: 73
  frontrun_exec_interval_secs: 180  # execute best FRONTRUN intent every 5m
  call_cooldown_secs: 180           # skip LLM call if inputs unchanged within this window

telegram:
  enabled: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  timeout_secs: 10

memory:
  enabled: true
  embedding_model: "text-embedding-3-small"
  embedding_dimensions: 1536
  top_similar: 5
  min_similarity: 0.4
  embed_skips: true
  max_memory_age: "90d"
  summarizer_model: "gpt-5.4-mini"

after_execution:
  enabled: true
  subscribe_before_seconds: 5       # subscribe @bookTicker at T-Xs before settlement
  min_bid_depth_multiplier: 1.0     # skip if bidDepthUSDT < multiplier * orderSize
  full_size_depth_multiplier: 3.0   # use full size if bidDepth >= 3x order
  reduced_size_pct: 50              # position size pct when book is thin (< 1.5x)
  clock_sync_interval_seconds: 300  # sync Binance server time every 5m
  fallback_to_scheduler: true       # scheduler fires as fallback if trigger fails

pre_settlement:
  enabled: true
  check_before_minutes: 2              # fire check at T-2m before settlement
  emergency_close_threshold: 0.75     # close if loss > 0.75 * |funding_rate|
  widen_tp_on_miss: true               # widen TP1 to 2%+|funding_rate| if not filled

order_book_filter:
  enabled: true
  max_spread_bps: 15.0  # exclude if spread > 0.15%
  depth_ratio_n: 30.0   # ask wall between entry and SL must be >= 30× position notional
  depth_levels: 500      # order book levels to fetch per symbol

protection_sweep:
  enabled: true
  interval_seconds: 60   # must stay well under the 70s PendingEntry TTL
  grace_seconds: 30      # skip stubs younger than this — let a normal WS fill land first
