app:
  mode: "paper"
  log_level: "info"
  paper_balance: 1000.0

binance:
  api_key: "${BINANCE.API_KEY}"
  api_secret: "${BINANCE.API_SECRET}"
  base_url: "https://fapi.binance.com"
  ws_url: "wss://fstream.binance.com"
  testnet: false

trading:
  max_positions: 3
  leverage: 20
  position_size_pct: 5.0
  cooldown_minutes: 15

funding:
  min_rate: -0.02
  max_rate: -0.002
  top_candidates: 10

execution:
  sl_pct: 5.0
  tp_pct: 2.1
  trailing_enabled: false
  trailing_activation_pct: 1.5
  breakeven_activation_pct: 1.5
  slippage_bps: 1

scheduler:
  scan_interval_early: "1m"
  scan_interval_late: "1m"
  window_start_minutes: 15

websocket:
  ping_interval: "2m"
  stale_timeout: "30s"
  max_reconnect_failures: 5
  reconnect_base_backoff: "1s"
  reconnect_max_backoff: "30s"

database:
  postgres:
    host: "${POSTGRES.HOST}"
    port: "${POSTGRES.PORT}"
    user: "${POSTGRES.USERNAME}"
    password: "${POSTGRES_PASSWORD}"
    dbname: "${POSTGRES.DATABASE}"
    sslmode: "disable"
    max_conns: 10
  redis:
    addr: "${REDIS.HOST}:${REDIS.PORT}"
    password: "${REDIS.PASSWORD}"
    db: "${REDIS.DATABASE}"

filtering:
  min_daily_roi_pct: 20.0
  min_volume_24h_m: 25.0

scoring:
  weights:
    funding: 25
    oi: 15
    btc: 10
    candle: 20
    volume: 10
    roi: 15
    volatility: 5
  min_score: 60.0

indicators:
  rsi_period: 14
  atr_period: 14
  oi_window: "1h"
  volume_avg_window: 24
  volume_spike_threshold: 2.0

risk:
  max_daily_losses: 2
  max_drawdown_pct: 10.0
  max_atr_ratio: 6.0
  btc_breakout_reject: true

backtest:
  data_dir: "./data/backtest"

llm:
  enabled: false
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4.1-mini"
  timeout_secs: 15
  max_retries: 1
  max_rpm: 30
  top_candidates: 5
  min_confidence: 60
  frontrun_exec_interval_secs: 300  # execute best FRONTRUN intent every 5m
  call_cooldown_secs: 300           # skip LLM call if inputs unchanged within this window
